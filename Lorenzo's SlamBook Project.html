<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Form</title>
<style>
    body{
        background-image: url(https://f4.bcbits.com/img/a2763223070_10.jpg);
        background-color: rgb(62, 16, 16)
    }
</style>
</head>
<body>
    <h1>Lorenzo Slambook</h1>
    <h6>yo wassup.</h6>
    <br><br>
    <h4>Answer pls</h4>
    <form>
         <label for="fname">First Name: </label>
        <input type="text" id="fname" name="fname" placeholder="Place your first name here">
        <br>
        <label for="lname">Last Name: </label>
        <input type="text" id="lname" name="lname" placeholder="Place your last name here">
        <br>
        <label for="address">Address: </label>
        <input type="text" id="address" name="address" placeholder="Place your address here">
        <br>
        <p>Gender:</p>
        <input type="radio" id="gender" name="gender" value="female">
        <label for="female">Female</label>
        <br>
        <input type="radio" id="gender" name="gender" value="male">
        <label for="male">Male</label>
        <br>
        <input type="radio" id="gender" name="gender" value="N/A">
        <label for="N/A">N/A</label>
        <p>Tell me your favorites!</p>
        <p><b>Favorite Color:</b></p>
        <input type="checkbox" id="Color1" name="Color1" value="red">
        <label for="red">Red</label>
        <br>
        <input type="checkbox" id="Color2" name="Color2" value="orange">
        <label for="orange">Orange</label>
        <br>
        <input type="checkbox" id="Color3" name="Color3" value="yellow">
        <label for="yellow">Yellow</label>
        <br>
        <input type="checkbox" id="Color4" name="Color4" value="green">
        <label for="green">Green</label>
        <br>
        <input type="checkbox" id="Color5" name="Color5" value="blue">
        <label for="blue">Blue</label>
        <br>
        <input type="checkbox" id="Color6" name="Color6" value="purple">
        <label for="purple">Purple</label>
        <br>
        <input type="checkbox" id="Color7" name="Color7" value="pink">
        <label for="pink">Pink</label>
        <br>
        <p><b>favorite food </b></p>
        <label for="food">Choose your favoritie food<label>
            <select id="food" name="dessert">
                <option value="ice cream">ice cream</option>
                <option value="brownies">brownies</option>
                <option value="cookies">cookies</option>
                <option value="cake">cake</option>
            </select>
            <p><b>Dedication</b><p>
            <label for="dedication">write a short message for me</label>
            <br>
            <textarea id="dedication" name="dedication" rows="4" cols="50" placeholder="type here..."> </textarea>
            <br>
            <input type="submit" value="Send">
    </form>
</body>
</html>
